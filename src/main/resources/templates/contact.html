<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/app.css"/>
  <title>Formulario</title>

  <style>
    .row { scroll-margin-top: 95px; }

    .err{
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,90,122,.35);
      background: rgba(255,90,122,.08);
      color: rgba(255,255,255,.92);
    }

    .input.is-invalid{
      border: 1.5px solid #ff5a7a !important;
    }

    .filters{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:15px 0;
    }

    .filters input, .filters select{
      padding:8px;
      border-radius:8px;
      border:1px solid #444;
      background:#111;
      color:white;
    }

    table{
      width:100%;
      border-collapse: collapse;
      margin-top:15px;
    }

    th, td{
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,.1);
      text-align:left;
    }

    th{
      background:#111;
    }

    .btn{
      padding:10px 16px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }

    .btn-light{
      background:#eaeaea;
      color:#000;
    }

  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">A</div>
      <span>DemoApp</span>
    </div>

    <div class="nav-links">
      <a href="/">Inicio</a>
      <a href="/features">Explorar</a>
      <a href="/calculator">Calculadora</a>
      <a href="/contact" class="active">Formulario</a>
      <a href="/carousel">Carrusel</a>
      <a href="/hello">Hola</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="card">

    <h1>Formulario</h1>
    <p class="sub">Todos los campos son obligatorios</p>

    <!-- Formulario para enviar los datos -->
    <form id="contactForm" action="/contact" method="POST" autocomplete="off">

      <div class="row">
        <label>Nombre completo</label>
        <input id="fullName" name="fullName" class="input" maxlength="70" required />
      </div>

      <div class="row">
        <label>Correo electrónico</label>
        <input id="email" name="email" type="email" class="input" required />
      </div>

      <div class="row">
        <label>Teléfono</label>
        <input id="phone" name="phone" class="input" required />
      </div>

      <div class="row">
        <label>Fecha de nacimiento</label>
        <input id="birthDate" name="birthDate" type="date" class="input" required />
      </div>

      <div class="row">
        <label>Mensaje</label>
        <textarea id="message" name="message" rows="4" class="input" required></textarea>
      </div>

      <div id="clientError" class="err" style="display:none;"></div>

      <button type="submit" class="btn btn-light">Enviar</button>
    </form>

    <hr style="margin:30px 0">

    <h2>Usuarios / Registros</h2>
    <p>Filtra por texto o por rango de fechas (creación/envío)</p>

    <div class="filters">
      <input id="filterQ" placeholder="Buscar nombre / email / tel">
      <input id="filterFrom" type="date">
      <input id="filterTo" type="date">

      <select id="filterLimit">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>

      <button id="btnApply" class="btn btn-light" type="button">Aplicar filtros</button>
      <button id="btnClear" class="btn btn-light" type="button">Limpiar</button>
      <button id="btnDump" class="btn btn-light" type="button">Dump JSON</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Fecha Nac.</th>
          <th>Creado</th>
        </tr>
      </thead>
      <tbody id="apiTable"></tbody>
    </table>

  </div>
</main>

<script src="/contact-api.js"></script>

</body>
</html>
